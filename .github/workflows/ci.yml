name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PowerShell syntax
        shell: powershell
        run: ./tests/test_powershell_syntax.ps1
      - name: Install native Windows workflow
        shell: powershell
        run: ./scripts/setup/install-llm.ps1
      - name: Validate Windows launchers
        shell: powershell
        run: |
          .\llm.cmd --version
          .\llm.cmd paths --json
      - name: Windows unit tests
        run: python -m unittest tests.test_windows_support -v
